
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Bus Ticket Booking</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url(https://wallpapers.com/images/hd/bus-pictures-dcx40022epk7s7yb.jpg);

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}.container{
    width:450px;
    background:rgba(255,255,255,0.93);
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    color:#0a3d91;
    margin-bottom:5px;
}

p{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

label{
    font-weight:bold;
    color:#333;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus,select:focus{
    outline:none;
    border:2px solid #0a66ff;
}

button{
    width:100%;
    padding:14px;
    background:#0aa33b;
    color:white;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#06782a;
}

#result{
    display:none;
    margin-top:20px;
    background:#e8fff0;
    border-left:5px solid green;
    padding:15px;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>🚌 Online Bus Ticket Booking</h1>
<p>Book your journey safely and comfortably</p>

<label>Passenger Name</label>
<input type="text" id="name" placeholder="Enter Name">

<label>Bus Type</label>
<select id="bus">
<option>Volvo</option>
<option>AC Coach</option>
<option>Sleeper Coach</option>
<option>Luxury Bus</option>
</select>

<label>From</label>
<input type="text" id="from" placeholder="Starting Place">

<label>To</label>
<input type="text" id="to" placeholder="Destination">

<label>Date of Journey</label>
<input type="date" id="date">

<label>Seat Number</label>
<select id="seat">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
</select>

<button onclick="bookTicket()">Book Ticket</button>

<div id="result"></div>

</div>

<script>

function bookTicket(){

let name=document.getElementById("name").value;
let bus=document.getElementById("bus").value;
let from=document.getElementById("from").value;
let to=document.getElementById("to").value;
let date=document.getElementById("date").value;
let seat=document.getElementById("seat").value;

if(name==""||from==""||to==""||date==""){
alert("Please fill all fields");
return;
}

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=
"<h3 style='color:green'>✔ Booking Successful</h3><br>"+
"<b>Name:</b> "+name+"<br>"+
"<b>Bus:</b> "+bus+"<br>"+
"<b>Route:</b> "+from+" ➜ "+to+"<br>"+
"<b>Date:</b> "+date+"<br>"+
"<b>Seat No:</b> "+seat+"<br><br>"+
"<b>Have a Safe Journey!</b>";

}

</script>

</body>
</html>
