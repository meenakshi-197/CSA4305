<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form Validation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid gray;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

span{
    color:red;
    font-size:14px;
    display:block;
    margin-top:5px;
}

.success{
    color:green;
}

</style>

</head>

<body>

<div class="container">

<h2>Registration Form</h2>

<form id="regForm">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<span id="emailError"></span>

<label>Phone Number</label>

<input
type="text"
id="phone"
maxlength="10"
placeholder="Enter Phone Number"
required>

<span id="phoneError"></span>

<button type="submit">
Register
</button>

</form>

</div>

<script>

const form=document.getElementById("regForm");

const email=document.getElementById("email");
const phone=document.getElementById("phone");

const emailError=document.getElementById("emailError");
const phoneError=document.getElementById("phoneError");

const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const phonePattern=/^[0-9]{10}$/;

// Real-time Email Validation
email.addEventListener("input",function(){

if(emailPattern.test(email.value)){
emailError.textContent="Valid Email";
emailError.className="success";
}
else{
emailError.textContent="Enter a valid email address";
emailError.className="";
}

});

// Real-time Phone Validation
phone.addEventListener("input",function(){

if(phonePattern.test(phone.value)){
phoneError.textContent="Valid Phone Number";
phoneError.className="success";
}
else{
phoneError.textContent="Enter a valid 10-digit phone number";
phoneError.className="";
}

});

// Form Validation
form.addEventListener("submit",function(e){

if(!emailPattern.test(email.value) || !phonePattern.test(phone.value)){
e.preventDefault();
alert("Please enter valid Email and Phone Number.");
}
else{
alert("Registration Successful!");
}

});

</script>

</body>
</html>
