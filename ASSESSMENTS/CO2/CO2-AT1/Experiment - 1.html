<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Retail Store</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    line-height:1.6;
}

/* Header */

header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

/* Navigation */

nav{
    background:#34495e;
    display:flex;
    justify-content:center;
    gap:30px;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#00d4ff;
}

/* Main Layout */

.container{
    display:flex;
    gap:20px;
    padding:20px;
}

/* Sidebar */

aside{
    flex:1;
    background:white;
    padding:20px;
    border-radius:8px;
}

aside h2{
    margin-bottom:15px;
}

aside ul{
    padding-left:20px;
}

/* Main Content */

main{
    flex:3;
    background:white;
    padding:20px;
    border-radius:8px;
}

.products{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.card{
    flex:1 1 220px;
    background:#3498db;
    color:white;
    text-align:center;
    padding:30px;
    border-radius:8px;
    transition:.3s;
}

.card:hover{
    background:#217dbb;
    transform:scale(1.03);
}

/* Footer */

footer{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}

/* Tablet */

@media(max-width:768px){

.container{
    flex-direction:column;
}

.products{
    justify-content:center;
}

}

/* Mobile */

@media(max-width:480px){

nav{
    flex-direction:column;
    align-items:center;
}

.products{
    flex-direction:column;
}

.card{
    width:100%;
}

}

</style>

</head>

<body>

<header>

<h1>Retail Store</h1>

</header>

<nav>

<a href="#">Home</a>

<a href="#">Products</a>

<a href="#">Offers</a>

<a href="#">Contact</a>

</nav>

<div class="container">

<aside>

<h2>Categories</h2>

<ul>

<li>Electronics</li>

<li>Fashion</li>

<li>Books</li>

<li>Sports</li>

</ul>

</aside>

<main>

<h2>Featured Products</h2>

<div class="products">

<div class="card">
<h3>Laptop</h3>
<p>High Performance</p>
</div>

<div class="card">
<h3>Smartphone</h3>
<p>Latest Model</p>
</div>

<div class="card">
<h3>Headphones</h3>
<p>Wireless</p>
</div>

<div class="card">
<h3>Watch</h3>
<p>Smart Watch</p>
</div>

</div>

</main>

</div>

<footer>

&copy; 2026 Retail Store

</footer>

</body>
</html>
